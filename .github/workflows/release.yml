name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version from the build, for example 0.1.0"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: maven-central-release
  cancel-in-progress: false

jobs:
  verify:
    name: Verify release
    runs-on: ubuntu-latest
    steps:
      - name: Check out selected release commit
        uses: actions/checkout@v7

      - name: Install JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Validate release branch and version
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          test "$GITHUB_REF_TYPE" = "branch" || { echo "Select the release branch"; exit 1; }
          test "$GITHUB_REF_NAME" = "release" || { echo "Select the release branch"; exit 1; }
          [[ "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Use a version such as 0.1.0"; exit 1; }
          ./gradlew verifyReleaseVersion "-PreleaseVersion=$RELEASE_VERSION" --no-daemon

      - name: Run release gates
        run: ./gradlew verifyRelease --no-daemon

  publish:
    name: Tag and publish release
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    environment:
      name: release
      url: https://central.sonatype.com/publishing
    steps:
      - name: Check out verified release commit
        uses: actions/checkout@v7
        with:
          persist-credentials: true

      - name: Install JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Verify publishing credentials
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          GPG_SIGNING_KEY: ${{ secrets.GPG_SIGNING_KEY }}
          GPG_SIGNING_KEY_PASSWORD: ${{ secrets.GPG_SIGNING_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$MAVEN_CENTRAL_USERNAME" || { echo "Missing release environment secret MAVEN_CENTRAL_USERNAME"; exit 1; }
          test -n "$MAVEN_CENTRAL_PASSWORD" || { echo "Missing release environment secret MAVEN_CENTRAL_PASSWORD"; exit 1; }
          test -n "$GPG_SIGNING_KEY" || { echo "Missing release environment secret GPG_SIGNING_KEY"; exit 1; }
          test -n "$GPG_SIGNING_KEY_PASSWORD" || { echo "Missing release environment secret GPG_SIGNING_KEY_PASSWORD"; exit 1; }

      - name: Create or reuse version tag
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          tag="v${RELEASE_VERSION}"
          commit="$GITHUB_SHA"
          git fetch --no-tags origin "refs/heads/release:refs/remotes/origin/release"
          test "$(git rev-parse refs/remotes/origin/release)" = "$commit" || {
            echo "Release branch changed since verification; rerun the workflow"
            exit 1
          }
          if git ls-remote --exit-code --refs origin "refs/tags/$tag" >/dev/null; then
            git fetch --no-tags origin "refs/tags/$tag:refs/tags/$tag"
            existing_commit="$(git rev-parse "$tag^{commit}")"
            test "$existing_commit" = "$commit" || {
              echo "Tag $tag exists but points to a different commit; refusing to publish"
              exit 1
            }
            echo "Reusing $tag at verified commit $commit"
          else
            git -c user.name=github-actions -c user.email=41898282+github-actions[bot]@users.noreply.github.com tag -a "$tag" "$commit" -m "Release $tag"
            if ! git push origin "refs/tags/$tag"; then
              git fetch --no-tags origin "refs/tags/$tag:refs/tags/$tag"
              existing_commit="$(git rev-parse "$tag^{commit}")"
              test "$existing_commit" = "$commit" || {
                echo "Tag $tag was created concurrently for a different commit; refusing to publish"
                exit 1
              }
              echo "Reusing concurrently created $tag at verified commit $commit"
            fi
          fi

      - name: Publish signed artifacts
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.GPG_SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.GPG_SIGNING_KEY_PASSWORD }}
        run: ./gradlew publishToMavenCentral --no-daemon
