name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version from the build, for example 0.1.0"
        required: true
        type: string

permissions:
  contents: read

jobs:
  verify:
    name: Verify release
    runs-on: ubuntu-latest
    steps:
      - name: Check out selected release tag
        uses: actions/checkout@v7

      - name: Install JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Validate release tag and version
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          test "$GITHUB_REF_TYPE" = "tag"
          test "$GITHUB_REF_NAME" = "v$RELEASE_VERSION"
          ./gradlew verifyReleaseVersion "-PreleaseVersion=$RELEASE_VERSION" --no-daemon

      - name: Run release gates
        run: ./gradlew verifyRelease --no-daemon

  publish:
    name: Publish to Maven Central
    needs: verify
    runs-on: ubuntu-latest
    environment:
      name: release
      url: https://central.sonatype.com/publishing
    steps:
      - name: Check out selected release tag
        uses: actions/checkout@v7

      - name: Install JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Verify publishing credentials
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          GPG_SIGNING_KEY: ${{ secrets.GPG_SIGNING_KEY }}
          GPG_SIGNING_KEY_PASSWORD: ${{ secrets.GPG_SIGNING_KEY_PASSWORD }}
        run: |
          test -n "$MAVEN_CENTRAL_USERNAME" || { echo "Missing release environment secret MAVEN_CENTRAL_USERNAME"; exit 1; }
          test -n "$MAVEN_CENTRAL_PASSWORD" || { echo "Missing release environment secret MAVEN_CENTRAL_PASSWORD"; exit 1; }
          test -n "$GPG_SIGNING_KEY" || { echo "Missing release environment secret GPG_SIGNING_KEY"; exit 1; }
          test -n "$GPG_SIGNING_KEY_PASSWORD" || { echo "Missing release environment secret GPG_SIGNING_KEY_PASSWORD"; exit 1; }

      - name: Publish signed artifacts
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.GPG_SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.GPG_SIGNING_KEY_PASSWORD }}
        run: ./gradlew publishToMavenCentral --no-daemon
